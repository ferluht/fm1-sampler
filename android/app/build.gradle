plugins { id 'com.android.application' }
android {
    namespace 'com.ferluht.fm1sampler'
    compileSdk 34
    defaultConfig { applicationId 'com.ferluht.fm1sampler'; minSdk 23; targetSdk 30; versionCode 1; versionName "0.1" }
    signingConfigs { debug { enableV1Signing = true; enableV2Signing = true } }
    buildFeatures { prefab true }
    defaultConfig { externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared'; cppFlags '' } }; ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' } }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    ndkVersion '27.2.12479018'
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies { implementation 'com.google.oboe:oboe:1.9.0' }
