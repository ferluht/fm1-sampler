# XcodeGen spec of the iOS app: `cd ios && xcodegen` writes FM1Sampler.xcodeproj. The engine (../engine) is compiled straight into the app,
# the bundled library (../samples) is copied as a folder.
name: FM1Sampler
options:
  bundleIdPrefix: ca.dallasgroot
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: E9C9AGS9K6
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.37"
    CURRENT_PROJECT_VERSION: "37"
    CLANG_CXX_LANGUAGE_STANDARD: c++20
    CLANG_ENABLE_OBJC_ARC: YES
    GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "SAMPLERATE=44100"]
    HEADER_SEARCH_PATHS:
      - $(SRCROOT)/../engine/dsp
      - $(SRCROOT)/../engine/session
      - $(SRCROOT)/../engine/app
      - $(SRCROOT)/../engine/ui
      - $(SRCROOT)/../engine/3rdparty/kissfft
      - $(SRCROOT)/../engine/tools
      - $(SRCROOT)/ThirdParty/remotefm1/include
      - $(SRCROOT)/ThirdParty/remotefm1/proto
      - $(SRCROOT)/ThirdParty/remotefm1/firmware/src
  configs:
    # the test tools (Documents/diag.env, FM1_* switches, script runner, network MIDI session, fake unit) are compiled in only here
    Debug:
      GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "FM1_TEST_TOOLS=1"]
targets:
  FM1Sampler:
    type: application
    platform: iOS
    sources:
      - path: FM1Sampler/Sources
      - path: FM1Sampler/RemoteFM1
        compilerFlags: ["-w", "-O2", "-std=c99"]
      - path: ThirdParty/remotefm1
        buildPhase: none
      - path: FM1Sampler/Assets.xcassets
      - path: FM1Sampler/PrivacyInfo.xcprivacy
      # (no tracking, no collected data; the required-reason APIs it declares are listed in the file)
      - path: ../samples
        type: folder
        buildPhase: resources
      # the engine: real-time DSP, always optimised (a -O0 debug build would not keep up), its warnings are upstream's business
      - path: ../engine/dsp
        group: Engine
        compilerFlags: ["-w", "-O2"]
      - path: ../engine/session
        group: Engine
        compilerFlags: ["-w", "-O2"]
      - path: ../engine/app
        group: Engine
        compilerFlags: ["-w", "-O2"]
      - path: ../engine/ui
        group: Engine
        compilerFlags: ["-w", "-O2"]
      - path: ../engine/3rdparty/kissfft/kiss_fft.c
        group: Engine/kissfft
        compilerFlags: ["-w", "-O2"]
      - path: ../engine/3rdparty/kissfft/kiss_fftr.c
        group: Engine/kissfft
        compilerFlags: ["-w", "-O2"]
    dependencies:
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreMIDI.framework
      - sdk: CoreAudioKit.framework
      - sdk: CoreText.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: QuartzCore.framework
      - sdk: CoreGraphics.framework
      - sdk: UIKit.framework
      - sdk: Foundation.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.dallasgroot.fm1sampler
        PRODUCT_NAME: FM1Sampler
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: FM1Sampler/Info.plist
      properties:
        CFBundleDisplayName: FM1 Sampler
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: true   # kept on iPad too: the layout needs 860 x 400 units, Split View / Slide Over would give less
        UIStatusBarHidden: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: The microphone records new samples and loops.
        NSBluetoothAlwaysUsageDescription: Bluetooth connects an FM-1 that runs the RemoteFM1 firmware, without a cable.
        NSLocalNetworkUsageDescription: Network MIDI lets a computer stand in for the FM-1 while testing.
        NSBonjourServices: [_apple-midi._udp]
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: SceneDelegate
